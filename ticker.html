<!DOCTYPE html>
<html>
	<head>
	<title>Ticker</title>
		<style>
			dialog{
				border: none;
				min-width: 70%;
			}
      .marquee-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        overflow: hidden;
        white-space: nowrap;
      }
      #media {
        font-size: 20px;
        display: inline-block;
        padding-left: 100%; /* ## */
        animation: marquee-scroll 15s linear infinite;
      }
      @keyframes marquee-scroll {
          0% { transform: translateX(0)}
          100% { transform: translateX(-100%)}
      }
		</style>
	</head>
	<body style="margin: 0">
    <div class="marquee-container">
      <div id="media">Lorem <span style="color: red">ipsum</span> dolor sit amet, <b>adipiscing</b> <i>elit</i>. Aenean <sub>commodo</sub> ligula eget dolor.</div>
    </div>
    <input type="file" id="sOpenInp" accept="text/plain, .txt, text/html, .html, .htm" onchange="setSingle(this.files[0].path)" style="display:none"/>
    <dialog id="mediaDlg">
      Font: <select id="familySel" onchange="media.style.fontFamily = this.value">
        <option>serif</option>
        <option>sans-serif</option>
        <option>monospace</option>
        <option>cursive</option>
        <option>Times New Roman</option>
      </select> 
      , size: <input type="number" id="sizeInp" style="width: 3em" onchange="media.style.fontSize = this.value+'px'"/> px 
      , color: <input id="fcolorInp" type="color" onchange="media.style.color = this.value"/><br/>
      <textarea id="textInp" onchange="media.innerHTML = this.value" placeholder="Enter plain text line or HTML line (only inline elements)" style="width: 95%"></textarea><br/>
      From file: <input type="url" id="singleFileInp" onchange="" style="width: 75%" placeholder="local path or http address for text/HTML file"/> <button onclick="document.getElementById('sOpenInp').click()">&#x1F4C4;</button><br/>
      Speed: <input type="number" id="vInp" style="width: 4em" onchange="adjDuration()"/><br/>
      <hr/>
      <button commandfor="mediaDlg" command="close">Close</button>
    </dialog>
    <script>
      //const url = require('node:url')
      const fs = require('node:fs')
      const media = document.querySelector('#media')
      const mediaDlg = document.querySelector('#mediaDlg') 
      const vInp = document.querySelector('#vInp')
      const textInp = document.getElementById('textInp')
      const fileInp = document.getElementById('singleFileInp')
      const rob = new ResizeObserver(entries => {
        for(let entry of entries){
          //const width = entry.contentRect.width
          adjDuration()
        }
      })
      rob.observe(media)

      window.addEventListener('load', (ev) => {
        console.log('ticker loaded')
        textInp.value = media.innerHTML
        vInp.value = Math.round(media.getBoundingClientRect().width/parseInt(getComputedStyle(media).animationDuration))
      })

      mediaDlg.addEventListener('beforetoggle', (ev) => {
        if(ev.newState == 'open'){
          document.getElementById('sizeInp').value = parseInt(getComputedStyle(media).fontSize)
          document.getElementById('familySel').value = getComputedStyle(media).fontFamily;//! remove quotation (Times NR)
          document.getElementById('fcolorInp').value = media.style.color
        }
      })

      function setSingle(addr){
        fileInp.value = addr
        const urlOb = new URL(addr)
        if(['http:', 'https:', 'ftp:'].includes(urlOb.protocol)){
        }
        else
          readLocalFile(addr)
      }

      function readLocalFile(path){
        const data = fs.readFileSync(path, 'utf8') 
        media.innerHTML = data
      }

      function adjDuration(){
        const width = media.getBoundingClientRect().width
        const v = vInp.value
        const t = width/v
        console.log(t+'s')
        media.style.animationDuration = t +'s'
      }

      function getSettings(){
        let obj = {}
        if(textInp.value)
          obj['src'] = textInp.value
        if(fileInp.value)
          obj['srcFile'] = fileInp.value
        obj['speed'] = parseInt(vInp.value)
        obj['fontsize'] = getComputedStyle(media).fontSize
        obj['fontfamily'] = getComputedStyle(media).fontFamily
        obj['color'] = media.style.color
        return obj
      }
      function setSettings(obj){  
        media.style.fontSize = obj.fontsize
        media.style.fontFamily = obj.fontfamily
        media.style.color = obj.color
        if(obj.src){
          textInp.value = obj.src
          media.innerHTML = obj.src
        }
        if(obj.srcFile){
          fileInp.value = obj.srcFile
          setSingle(obj.srcFile)
        }
        vInp.value = obj.speed; adjDuration()
      }
    </script>
  </body>
